</text>
<rect x="1260.0" y="124.0" width="140.0" height="31.0" rx="7.0" fill="#24a85b" stroke="#24a85b" stroke-width="1.6" />
<text x="1330.0" y="144.5" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">
