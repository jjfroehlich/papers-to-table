</text>
<text x="165.0" y="236.0" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="16.5" font-weight="bold" fill="#2563eb" text-anchor="start">
<tspan x="165.0" dy="0">preflight -&gt; headless --accept-all --export</tspan>
</text>
<text x="165.0" y="270.0" font-family="Segoe UI, Inter, Arial, sans-serif" font-size="14" font-weight="normal" fill="#617083" text-anchor="start">
