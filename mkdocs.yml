site_name: papers-to-table manual
site_description: Local-first manual for papers-to-table workflows, tools, and operators.
site_dir: site

docs_dir: docs
exclude_docs: |
  /README.md

theme:
  name: material
  features:
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.highlight

validation:
  nav:
    omitted_files: ignore

nav:
  - Home: index.md
  - Getting Started:
      - Overview: getting-started/index.md
      - Installation: getting-started/installation.md
      - Quickstart: getting-started/quickstart.md
      - Configuration: getting-started/configuration.md
  - Main App:
      - Overview: main-app/overview.md
      - Browser Review: main-app/browser-review.md
      - Headless and Accept-All: main-app/headless.md
      - Outputs and Artifacts: main-app/outputs-and-artifacts.md
  - Companion Tools:
      - Eval: tools/eval.md
      - Optimizer: tools/optimizer.md
  - Operators:
      - LM Studio: operators/lm-studio.md
      - Troubleshooting (Canonical): operators/troubleshooting.md
      - Privacy and Locality: operators/privacy-locality.md
  - Agents:
      - Agent Usage: agents/agent-usage.md
      - papers-to-table Skill: agents/papers-to-table-skill.md
  - Development:
      - Architecture: development/architecture.md
      - First 30 Minutes: development/first-30-minutes.md
      - Specs and Truth Model: development/specs.md
      - GitHub Pages (Future): development/github-pages.md
