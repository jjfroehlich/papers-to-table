[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-table-agent"
version = "0.1.0"
description = "Local-first paper-to-table review workflow MVP"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.28",
  "openpyxl>=3.1",
  "pillow>=11.1",
  "pydantic>=2.10",
  "pypdf>=5.1",
  "pypdfium2>=4.30",
  "python-multipart>=0.0.18",
  "uvicorn>=0.34"
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0",
  "pytest-cov>=6.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["tests/backend"]
