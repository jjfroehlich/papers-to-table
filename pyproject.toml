[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
markers = [
    "e2e: end-to-end tests requiring live backend and frontend (opt-in)",
    "smoke: opt-in live smoke tests requiring external services (e.g. LM Studio)",
    "performance: performance smoke tests that measure timing regressions",
]
