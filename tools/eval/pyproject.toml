[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "papers-to-table-eval"
version = "0.1.0"
description = "CLI-first evaluation companion for papers-to-table run bundles"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "openpyxl==3.1.5",
  "pyarrow==23.0.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
paper-eval = "paper_eval.cli:main"

[tool.setuptools.packages.find]
include = ["paper_eval*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
