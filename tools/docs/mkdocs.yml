site_name: papers-to-table manual
site_description: Local-first manual for papers-to-table workflows, tools, and operators.
site_dir: ../../site

docs_dir: ../../docs
exclude_docs: |
  /README.md
  /architecture-decisions/**
  /contracts/**
  /engineering-lessons/**
  /implementation-plans/**
  /research/**

theme:
  name: material
  logo: assets/brand/logo.svg
  favicon: assets/brand/logo.svg
  palette:
    - scheme: default
      primary: grey
      accent: deep orange
  font: false
  features:
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.top
    - toc.integrate
    - content.code.copy
    - search.suggest
    - search.highlight

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.highlight

validation:
  nav:
    omitted_files: ignore

nav:
  - Start:
      - Basics: index.md
  - Getting Started:
      - Model Provider (LM Studio): getting-started/lm-studio.md
      - Installation: getting-started/installation.md
      - Configuration: getting-started/configuration.md
      - Preflight And Run Commands: getting-started/preflight-and-run.md
      - Troubleshooting: getting-started/troubleshooting.md
  - Main App:
      - Browser Review: main-app/browser-review.md
      - Headless and Accept-All: main-app/headless.md
      - Outputs and Artifacts: main-app/outputs-and-artifacts.md
      - Architecture: main-app/architecture.md
      - Privacy and Locality: main-app/privacy-locality.md
  - Companion Tools:
      - Eval: tools/eval.md
      - Optimizer: tools/optimizer.md
      - Papers-to-Table Skill: tools/papers-to-table-skill.md
