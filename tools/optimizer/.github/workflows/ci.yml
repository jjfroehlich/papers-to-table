name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        working-directory: tools/optimizer
        run: python -m pip install --upgrade pip && python -m pip install -e .[dev]
      - name: Run tests
        working-directory: tools/optimizer
        run: pytest