<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Papers-to-table rich review</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #101828;
      --muted: #667085;
      --border: #d7dde7;
      --panel: #ffffff;
      --paper: #f5f7fb;
      --accent: #0f766e;
      --accent-2: #2563eb;
      --warn: #b45309;
      --danger: #be123c;
      --ok: #047857;
      --shadow: 0 10px 30px rgba(16, 24, 40, 0.08);
      font-family: "Aptos", "Segoe UI", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); }
    button, input, textarea, select { font: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: .55; }
    header {
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
      min-height: 66px; padding: 12px 18px; background: #fff; border-bottom: 1px solid var(--border);
    }
    h1 { margin: 0; font-size: 18px; letter-spacing: 0; }
    .subtle { color: var(--muted); font-size: 12px; }
    .top-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    .status-stack { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
    .btn {
      border: 1px solid var(--border); background: #fff; color: #344054;
      border-radius: 7px; padding: 7px 10px; font-weight: 650; font-size: 13px;
    }
    .btn:hover { background: #f8fafc; }
    .btn.primary { background: var(--ink); border-color: var(--ink); color: #fff; }
    .btn.accept { background: var(--ok); border-color: var(--ok); color: #fff; }
    .btn.danger { color: var(--danger); }
    .layout {
      height: calc(100vh - 66px); min-height: 620px; display: grid;
      grid-template-columns: minmax(260px, 23vw) minmax(360px, 1fr) minmax(360px, 34vw);
      gap: 0; padding: 10px;
    }
    .pane {
      min-height: 0; background: var(--panel); border: 1px solid var(--border);
      overflow: hidden; display: flex; flex-direction: column;
    }
    .pane.left { border-radius: 10px 0 0 10px; border-right: 0; }
    .pane.middle { border-radius: 0; }
    .pane.right { border-radius: 0 10px 10px 0; border-left: 0; }
    .pane-head { flex: 0 0 auto; padding: 12px; border-bottom: 1px solid var(--border); background: #fbfcfe; }
    .pane-title { margin: 0 0 8px; font-size: 12px; color: #475467; text-transform: uppercase; font-weight: 750; letter-spacing: .08em; }
    .seg { display: grid; grid-template-columns: repeat(2, 1fr); gap: 4px; padding: 3px; border: 1px solid var(--border); border-radius: 8px; background: #fff; }
    .seg button { border: 0; border-radius: 6px; padding: 7px; background: transparent; color: #667085; font-size: 12px; font-weight: 700; }
    .seg button.active { background: #111827; color: #fff; }
    .filters { margin-top: 8px; width: 100%; border: 1px solid var(--border); border-radius: 7px; padding: 8px; color: #344054; background: #fff; }
    .scroll { flex: 1 1 auto; min-height: 0; overflow: auto; }
    .queue-item {
      width: 100%; display: block; border: 0; border-bottom: 1px solid #edf0f5;
      background: #fff; padding: 11px 12px; text-align: left;
    }
    .queue-item:hover { background: #f8fafc; }
    .queue-item.active { background: #e8f3ff; box-shadow: inset 4px 0 0 var(--accent-2); }
    .queue-main { display: flex; gap: 10px; align-items: start; justify-content: space-between; }
    .queue-value { margin-top: 4px; color: #344054; font-size: 13px; line-height: 1.35; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    .queue-meta { margin-top: 5px; color: var(--muted); font-size: 11px; }
    .tag-row { display: flex; flex-wrap: wrap; gap: 5px; }
    .tag { border: 1px solid #d8e0ea; background: #f8fafc; color: #475467; border-radius: 5px; padding: 2px 5px; font-size: 11px; font-weight: 700; }
    .tag.ok { background: #ecfdf3; border-color: #a6f4c5; color: #067647; }
    .tag.warn { background: #fffaeb; border-color: #fedf89; color: var(--warn); }
    .tag.danger { background: #fff1f3; border-color: #fecdd6; color: var(--danger); }
    .tag.info { background: #eff6ff; border-color: #bfdbfe; color: #1d4ed8; }
    .detail-scroll { padding: 14px; }
    .card { border: 1px solid var(--border); border-radius: 8px; background: #fff; padding: 12px; box-shadow: 0 1px 2px rgba(16,24,40,.03); margin-bottom: 10px; }
    .label { margin: 0 0 5px; font-size: 11px; text-transform: uppercase; color: #667085; font-weight: 800; letter-spacing: .08em; }
    .value { white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.45; }
    .big-value { font-size: 20px; font-weight: 760; line-height: 1.25; }
    .evidence-card { width: 100%; border: 1px solid var(--border); border-radius: 8px; background: #fff; padding: 10px; text-align: left; margin-top: 8px; }
    .evidence-card.active { border-color: #f59e0b; background: #fffbeb; }
    .action-bar { flex: 0 0 auto; border-top: 1px solid var(--border); padding: 10px 12px; background: #fff; display: flex; flex-wrap: wrap; gap: 7px; align-items: center; }
    .edit-row { width: 100%; display: none; gap: 7px; }
    .edit-row.visible { display: flex; }
    .edit-row input { flex: 1; min-width: 200px; border: 1px solid var(--border); border-radius: 7px; padding: 8px; }
    .table-wrap { overflow: auto; height: 100%; }
    table { border-collapse: separate; border-spacing: 0; min-width: 100%; font-size: 12px; }
    th, td { border-right: 1px solid #edf0f5; border-bottom: 1px solid #edf0f5; padding: 0; vertical-align: top; }
    th { position: sticky; top: 0; z-index: 4; background: #f8fafc; color: #667085; text-align: left; padding: 8px; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
    td button { min-width: 150px; min-height: 74px; border: 0; background: #fff; text-align: left; padding: 8px; color: #344054; }
    td button:hover { background: #f8fafc; }
    td button.active { outline: 2px solid var(--accent-2); outline-offset: -2px; background: #eff6ff; }
    .pdf-toolbar { flex: 0 0 auto; display: flex; align-items: center; gap: 7px; padding: 9px; border-bottom: 1px solid var(--border); background: #fbfcfe; }
    .pdf-stage { position: relative; flex: 1 1 auto; min-height: 0; overflow: auto; padding: 12px; background: #e9edf3; }
    .canvas-wrap { position: relative; display: inline-block; background: #fff; box-shadow: var(--shadow); }
    canvas { display: block; }
    .hl { position: absolute; pointer-events: none; background: rgba(250, 204, 21, .28); border: 2px solid rgba(180, 83, 9, .78); border-radius: 2px; }
    .hl.approx { background: rgba(249, 115, 22, .12); border: 2px dashed rgba(194, 65, 12, .75); }
    .viewer-note { margin: 10px; padding: 10px; border: 1px solid #fedf89; border-radius: 8px; background: #fffaeb; color: #92400e; font-size: 12px; }
    .empty { padding: 24px; color: var(--muted); text-align: center; font-size: 14px; }
    @media (max-width: 1050px) {
      .layout { height: auto; min-height: 0; grid-template-columns: 1fr; }
      .pane { min-height: 420px; border: 1px solid var(--border) !important; border-radius: 10px !important; margin-bottom: 10px; }
    }
  </style>
</head>
<body>
<script>
window.__REVIEW_PACKAGE__ = __REVIEW_PACKAGE_JSON__;
</script>
<header>
  <div>
    <h1>Papers-to-table review</h1>
    <div class="subtle" id="run-summary">Loading review package...</div>
  </div>
  <div class="top-actions">
    <div class="status-stack">
      <span class="tag info" id="server-status">Download mode</span>
      <span class="subtle" id="save-status-detail">Decisions are saved only in this browser until downloaded.</span>
    </div>
    <button class="btn" id="download-decisions">Download decisions</button>
    <button class="btn primary" id="write-decisions">Write decisions</button>
    <button class="btn accept" id="export-csv">Export CSV</button>
  </div>
</header>
<main class="layout">
  <section class="pane left">
    <div class="pane-head">
      <p class="pane-title">Review list</p>
      <div class="seg">
        <button id="mode-queue" class="active">Queue</button>
        <button id="mode-table">Table</button>
      </div>
      <select class="filters" id="filter">
        <option value="pending">Pending</option>
        <option value="attention">Attention</option>
        <option value="all">All</option>
        <option value="accepted">Accepted</option>
        <option value="accepted_with_edit">Edited</option>
        <option value="confirmed_no_data">No data</option>
        <option value="rejected">Rejected</option>
      </select>
    </div>
    <div class="scroll" id="list"></div>
  </section>
  <section class="pane middle">
    <div class="scroll detail-scroll" id="detail"></div>
    <div class="action-bar">
      <button class="btn" id="prev-proposal">Prev</button>
      <button class="btn danger" id="reject">Reject</button>
      <button class="btn" id="edit">Edit</button>
      <button class="btn" id="no-data">Confirm no data</button>
      <button class="btn accept" id="accept">Accept</button>
      <button class="btn" id="next-proposal">Next</button>
      <div class="edit-row" id="edit-row">
        <input id="edit-value" placeholder="Corrected value">
        <button class="btn primary" id="save-edit">Save edit</button>
        <button class="btn" id="cancel-edit">Cancel</button>
      </div>
    </div>
  </section>
  <section class="pane right">
    <div class="pdf-toolbar">
      <button class="btn" id="pdf-prev">Prev page</button>
      <span class="subtle" id="pdf-page">No PDF selected</span>
      <button class="btn" id="pdf-next">Next page</button>
      <button class="btn" id="zoom-out">-</button>
      <span class="subtle" id="zoom-label">125%</span>
      <button class="btn" id="zoom-in">+</button>
    </div>
    <div class="pdf-stage" id="pdf-stage"></div>
  </section>
</main>
<script type="module">
const pkg = window.__REVIEW_PACKAGE__;
const served = location.protocol.startsWith("http") && ["localhost", "127.0.0.1", "::1"].includes(location.hostname);
const localKey = `papersToTable.agentKit.decisions.${pkg.run_id}`;
const state = {
  mode: "queue",
  filter: "pending",
  selectedProposalId: pkg.proposals?.[0]?.proposal_id || null,
  selectedEvidenceId: null,
  decisions: loadLocalDecisions(),
  pdfjs: null,
  pdfDoc: null,
  pdfId: null,
  page: 1,
  pages: 0,
  zoom: 1.25,
  renderToken: 0,
  saveStatusKind: served ? "ready" : "download",
  saveStatusDetail: served
    ? "Localhost writeback is available."
    : "Decisions are saved only in this browser until downloaded."
};

function esc(value) {
  return String(value ?? "").replace(/[&<>"']/g, (ch) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[ch]));
}

function proposalById(id) {
  return (pkg.proposals || []).find((proposal) => proposal.proposal_id === id) || null;
}

function pdfById(id) {
  return (pkg.pdfs || []).find((pdf) => pdf.pdf_id === id) || null;
}

function currentProposal() {
  return proposalById(state.selectedProposalId);
}

function latestDecision(proposal) {
  return proposal ? state.decisions[proposal.proposal_id] || null : null;
}

function decisionValue(proposal) {
  return latestDecision(proposal)?.decision || "pending";
}

function displayValue(proposal) {
  const decision = latestDecision(proposal);
  if (decision?.decision === "accepted_with_edit") return decision.edited_value || "";
  if (proposal?.proposal_status === "no_data") return "No data proposed";
  if (!proposal || proposal.proposed_value === null || proposal.proposed_value === undefined || proposal.proposed_value === "") return "Unresolved";
  return proposal.proposed_value;
}

function isWeak(proposal) {
  return proposal?.review_bucket === "attention" || ["direct_weak", "inferred_weak", "no_evidence"].includes(proposal?.evidence_status);
}

function proposalMatches(proposal) {
  const decision = decisionValue(proposal);
  if (state.filter === "all") return proposal.review_bucket !== "diagnostic";
  if (state.filter === "pending") return decision === "pending";
  if (state.filter === "attention") return isWeak(proposal);
  return decision === state.filter;
}

function visibleProposals() {
  return (pkg.proposals || []).filter(proposalMatches);
}

function loadLocalDecisions() {
  try {
    const raw = localStorage.getItem(localKey);
    if (!raw) return {};
    const parsed = JSON.parse(raw);
    return parsed && typeof parsed === "object" ? parsed : {};
  } catch {
    return {};
  }
}

function storeLocalDecisions() {
  localStorage.setItem(localKey, JSON.stringify(state.decisions));
}

function setSaveStatus(kind, detail) {
  state.saveStatusKind = kind;
  state.saveStatusDetail = detail;
}

function renderSaveStatus() {
  const tag = document.getElementById("server-status");
  const detail = document.getElementById("save-status-detail");
  const statuses = {
    download: {
      className: "tag info",
      label: "Download mode",
      detail: "Decisions are saved only in this browser until downloaded."
    },
    ready: {
      className: "tag info",
      label: "Server ready",
      detail: "Localhost writeback is available."
    },
    local: {
      className: "tag warn",
      label: "Saved locally",
      detail: "Latest decision is only in browser storage until server writeback succeeds."
    },
    syncing: {
      className: "tag info",
      label: "Writing to server",
      detail: "Syncing decisions to review/decisions.jsonl..."
    },
    server: {
      className: "tag ok",
      label: "Saved to server",
      detail: "Decisions were written to review/decisions.jsonl."
    },
    error: {
      className: "tag danger",
      label: "Server write failed",
      detail: "Latest decision stayed only in browser storage."
    }
  };
  const status = statuses[state.saveStatusKind] || statuses.ready;
  tag.className = status.className;
  tag.textContent = status.label;
  detail.textContent = state.saveStatusDetail || status.detail;
}

async function loadServerDecisions() {
  if (!served) return;
  try {
    const response = await fetch("/api/decisions");
    if (!response.ok) {
      setSaveStatus("error", `Could not load existing server decisions: ${await response.text()}`);
      return;
    }
    const payload = await response.json();
    for (const decision of payload.decisions || []) {
      state.decisions[decision.proposal_id] = decision;
    }
    storeLocalDecisions();
    setSaveStatus(payload.decisions?.length ? "server" : "ready", payload.decisions?.length
      ? "Loaded existing server decisions and mirrored them into browser storage."
      : "Localhost writeback is available.");
  } catch (error) {
    setSaveStatus("error", `Could not load existing server decisions: ${error.message || error}`);
  }
}

function progress() {
  const reviewable = (pkg.proposals || []).filter((proposal) => proposal.review_bucket !== "diagnostic");
  const counts = {accepted: 0, accepted_with_edit: 0, rejected: 0, confirmed_no_data: 0, pending: 0};
  for (const proposal of reviewable) {
    const decision = decisionValue(proposal);
    counts[decision] = (counts[decision] || 0) + 1;
  }
  const reviewed = reviewable.length - counts.pending;
  return {total: reviewable.length, reviewed, ...counts};
}

function render() {
  const prog = progress();
  document.getElementById("run-summary").textContent =
    `${pkg.run_id} - ${prog.reviewed} / ${prog.total} reviewed - ${prog.pending} pending`;
  document.getElementById("write-decisions").disabled = !served;
  document.getElementById("export-csv").disabled = !served;
  renderSaveStatus();
  renderList();
  renderDetail();
}

function renderList() {
  if (state.mode === "table") {
    renderTable();
    return;
  }
  const list = document.getElementById("list");
  const items = visibleProposals();
  if (!items.length) {
    list.innerHTML = '<div class="empty">No proposals match the current filter.</div>';
    return;
  }
  list.innerHTML = items.map((proposal) => `
    <button class="queue-item ${proposal.proposal_id === state.selectedProposalId ? "active" : ""}" data-proposal="${esc(proposal.proposal_id)}">
      <div class="queue-main">
        <div><strong>${esc(proposal.column_name)}</strong><div class="queue-meta">${esc(rowLabel(proposal))}</div></div>
        <div class="tag-row">${statusTags(proposal)}</div>
      </div>
      <div class="queue-value">${esc(displayValue(proposal))}</div>
      <div class="queue-meta">${esc(decisionValue(proposal).replaceAll("_", " "))}</div>
    </button>
  `).join("");
  list.querySelectorAll("[data-proposal]").forEach((button) => {
    button.addEventListener("click", () => selectProposal(button.dataset.proposal));
  });
}

function renderTable() {
  const list = document.getElementById("list");
  const columns = pkg.columns || [];
  const rows = pkg.rows || [];
  const proposals = new Map((pkg.proposals || []).map((proposal) => [`${proposal.row_id}::${proposal.column_name}`, proposal]));
  list.innerHTML = `
    <div class="table-wrap"><table>
      <thead><tr>${columns.map((column) => `<th>${esc(column.column_name)}</th>`).join("")}</tr></thead>
      <tbody>${rows.map((row) => `<tr>${columns.map((column) => {
        const proposal = proposals.get(`${row.row_id}::${column.column_name}`);
        const value = proposal ? displayValue(proposal) : row.values?.[column.column_name] || "";
        const active = proposal?.proposal_id === state.selectedProposalId ? "active" : "";
        return `<td><button class="${active}" ${proposal ? `data-proposal="${esc(proposal.proposal_id)}"` : ""}>
          <div class="value">${esc(value || "-")}</div>
          ${proposal ? `<div class="tag-row" style="margin-top:6px">${statusTags(proposal)}</div>` : ""}
        </button></td>`;
      }).join("")}</tr>`).join("")}</tbody>
    </table></div>`;
  list.querySelectorAll("[data-proposal]").forEach((button) => {
    button.addEventListener("click", () => selectProposal(button.dataset.proposal));
  });
}

function rowLabel(proposal) {
  const row = (pkg.rows || []).find((candidate) => candidate.row_id === proposal.row_id);
  return row?.paper_label || row?.values?.Title || proposal.pdf_id || proposal.row_id;
}

function statusTags(proposal) {
  const decision = decisionValue(proposal);
  const decisionClass = decision === "pending" ? "" : decision === "rejected" ? "danger" : "ok";
  const evidenceClass = isWeak(proposal) ? "warn" : "ok";
  const tier = proposal.evidence_tiers?.length ? `Tier ${proposal.evidence_tiers.join("/")}` : "No tier";
  return `
    <span class="tag ${decisionClass}">${esc(decision.replaceAll("_", " "))}</span>
    <span class="tag ${evidenceClass}">${esc(proposal.evidence_status.replaceAll("_", " "))}</span>
    <span class="tag ${evidenceClass}">${esc(tier)}</span>
  `;
}

function renderDetail() {
  const detail = document.getElementById("detail");
  const proposal = currentProposal();
  if (!proposal) {
    detail.innerHTML = '<div class="empty">Select a proposal to review.</div>';
    renderPdf(null);
    return;
  }
  if (!state.selectedEvidenceId && proposal.evidence?.length) {
    state.selectedEvidenceId = proposal.primary_evidence_id || proposal.evidence[0].evidence_id;
  }
  const evidence = proposal.evidence || [];
  detail.innerHTML = `
    <div class="card">
      <div class="tag-row">${statusTags(proposal)}</div>
      <p class="label" style="margin-top:10px">Proposed value</p>
      <div class="big-value">${esc(displayValue(proposal))}</div>
    </div>
    ${proposal.rationale ? `<div class="card"><p class="label">Rationale</p><div class="value">${esc(proposal.rationale)}</div></div>` : ""}
    <div class="card">
      <p class="label">Evidence</p>
      ${evidence.length ? evidence.map((item) => evidenceCard(item)).join("") : '<div class="subtle">No evidence persisted for this proposal.</div>'}
    </div>
    <div class="card">
      <p class="label">Field</p>
      <div class="value"><strong>${esc(proposal.column_name)}</strong></div>
      <div class="subtle">${esc(columnDescription(proposal.column_name) || "")}</div>
    </div>
    <div class="card">
      <p class="label">Paper / row</p>
      <div class="value">${esc(rowLabel(proposal))}</div>
      <div class="subtle">${esc(proposal.row_id)} ${proposal.pdf_id ? "- " + esc(proposal.pdf_id) : ""}</div>
    </div>
  `;
  detail.querySelectorAll("[data-evidence]").forEach((button) => {
    button.addEventListener("click", () => {
      state.selectedEvidenceId = button.dataset.evidence;
      renderDetail();
    });
  });
  const selectedEvidence = evidence.find((item) => item.evidence_id === state.selectedEvidenceId) || evidence[0] || null;
  renderPdf(selectedEvidence);
}

function evidenceCard(item) {
  const active = item.evidence_id === state.selectedEvidenceId ? "active" : "";
  const text = item.quote_text || item.table_text || item.evidence_text || item.caption_text || item.reasoning || "No evidence text supplied.";
  const weak = item.evidence_tier === "C" || item.evidence_tier === "D";
  return `
    <button class="evidence-card ${active}" data-evidence="${esc(item.evidence_id)}">
      <div class="tag-row">
        <span class="tag ${weak ? "warn" : "ok"}">Tier ${esc(item.evidence_tier || "?")}</span>
        <span class="tag">${esc((item.source_type || "evidence").replaceAll("_", " "))}</span>
        ${item.page_number ? `<span class="tag info">p.${esc(item.page_number)}</span>` : ""}
      </div>
      <div class="value" style="margin-top:7px">${esc(text)}</div>
      ${weak ? '<div class="subtle" style="margin-top:6px">Weak evidence: review before accepting.</div>' : ""}
    </button>
  `;
}

function columnDescription(name) {
  return (pkg.columns || []).find((column) => column.column_name === name)?.description || null;
}

function selectProposal(id) {
  state.selectedProposalId = id;
  const proposal = currentProposal();
  state.selectedEvidenceId = proposal?.primary_evidence_id || proposal?.evidence?.[0]?.evidence_id || null;
  render();
}

function moveSelection(delta) {
  const items = visibleProposals();
  if (!items.length) return;
  const index = Math.max(0, items.findIndex((proposal) => proposal.proposal_id === state.selectedProposalId));
  const next = items[(index + delta + items.length) % items.length];
  selectProposal(next.proposal_id);
}

function makeDecision(decision, extras = {}) {
  const proposal = currentProposal();
  if (!proposal) return null;
  const record = {
    review_decision_id: `rev_${proposal.proposal_id}_${Date.now()}`,
    run_id: pkg.run_id,
    proposal_id: proposal.proposal_id,
    cell_id: proposal.cell_id,
    decision,
    decision_source: extras.decision_source || "human_individual",
    edited_value: extras.edited_value ?? null,
    reviewer_note: extras.reviewer_note ?? null,
    decided_at: new Date().toISOString()
  };
  state.decisions[proposal.proposal_id] = record;
  storeLocalDecisions();
  if (served) {
    setSaveStatus("syncing", "Syncing the latest decision to review/decisions.jsonl...");
    void postDecisions([record])
      .then(() => {
        setSaveStatus("server", "Latest decision was written to review/decisions.jsonl.");
        renderSaveStatus();
      })
      .catch((error) => {
        setSaveStatus("error", `Latest decision stayed only in browser storage: ${error.message || error}`);
        renderSaveStatus();
      });
  } else {
    setSaveStatus("download", "Decisions are saved only in this browser until downloaded.");
  }
  moveSelection(1);
  render();
  return record;
}

async function postDecisions(decisions) {
  const response = await fetch("/api/decisions", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({decisions})
  });
  if (!response.ok) throw new Error(await response.text());
  return response.json();
}

function allDecisionRows() {
  return Object.values(state.decisions);
}

function downloadDecisions() {
  const payload = {
    schema_version: "papers_to_table.agent_review_decisions.v1",
    run_id: pkg.run_id,
    created_at: new Date().toISOString(),
    decisions: allDecisionRows()
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type: "application/json"});
  const url = URL.createObjectURL(blob);
  const anchor = document.createElement("a");
  anchor.href = url;
  anchor.download = `${pkg.run_id || "review"}_decisions.json`;
  anchor.click();
  URL.revokeObjectURL(url);
}

async function writeDecisions() {
  if (!served) return;
  setSaveStatus("syncing", "Syncing all decisions to review/decisions.jsonl...");
  try {
    await postDecisions(allDecisionRows());
    setSaveStatus("server", "All decisions were written to review/decisions.jsonl.");
    renderSaveStatus();
    alert("Decisions written to review/decisions.jsonl");
  } catch (error) {
    setSaveStatus("error", `Server write failed; decisions remain in browser storage: ${error.message || error}`);
    renderSaveStatus();
    alert(`Write failed: ${error.message || error}`);
    throw error;
  }
}

async function exportCsv() {
  if (!served) {
    downloadDecisions();
    return;
  }
  await writeDecisions();
  const response = await fetch("/api/export", {method: "POST"});
  if (!response.ok) {
    alert(`Export failed: ${await response.text()}`);
    return;
  }
  const payload = await response.json();
  alert(`Exported ${payload.accepted_changes_count} accepted value(s) to ${payload.final_table_path}`);
}

async function loadPdfJs() {
  if (state.pdfjs !== null) return state.pdfjs;
  try {
    const mod = await import("./assets/pdf.mjs");
    mod.GlobalWorkerOptions.workerSrc = "./assets/pdf.worker.mjs";
    window.pdfjsLib = mod;
    state.pdfjs = mod;
  } catch {
    state.pdfjs = false;
  }
  return state.pdfjs;
}

async function renderPdf(evidence) {
  const stage = document.getElementById("pdf-stage");
  if (!evidence?.pdf_id) {
    stage.innerHTML = '<div class="empty">No PDF evidence selected.</div>';
    document.getElementById("pdf-page").textContent = "No PDF selected";
    return;
  }
  const pdf = pdfById(evidence.pdf_id);
  if (!pdf) {
    stage.innerHTML = '<div class="empty">PDF metadata missing for selected evidence.</div>';
    return;
  }
  const page = evidence.page_number || 1;
  const token = ++state.renderToken;
  const pdfjs = await loadPdfJs();
  if (token !== state.renderToken) return;
  if (!pdfjs) {
    stage.innerHTML = `<object data="${esc(pdf.asset_path)}#page=${esc(page)}" type="application/pdf" width="100%" height="100%">
      <div class="viewer-note">PDF.js assets are unavailable. Open the PDF manually: <a href="${esc(pdf.asset_path)}#page=${esc(page)}">page ${esc(page)}</a>.</div>
    </object>`;
    document.getElementById("pdf-page").textContent = `${pdf.label || pdf.pdf_id}, page ${page}`;
    return;
  }
  try {
    if (!state.pdfDoc || state.pdfId !== evidence.pdf_id) {
      state.pdfDoc = await pdfjs.getDocument(pdf.asset_path).promise;
      state.pdfId = evidence.pdf_id;
      state.pages = state.pdfDoc.numPages;
    }
    state.page = Math.max(1, Math.min(page, state.pages || page));
    await renderCurrentPage(evidence);
  } catch (error) {
    stage.innerHTML = `<div class="viewer-note">PDF render failed: ${esc(error.message || error)}</div>`;
  }
}

async function renderCurrentPage(evidence) {
  const token = state.renderToken;
  const stage = document.getElementById("pdf-stage");
  const page = await state.pdfDoc.getPage(state.page);
  if (token !== state.renderToken) return;
  const viewport = page.getViewport({scale: state.zoom});
  stage.innerHTML = '<div class="canvas-wrap"><canvas id="pdf-canvas"></canvas></div>';
  const canvas = document.getElementById("pdf-canvas");
  const wrap = stage.querySelector(".canvas-wrap");
  canvas.width = viewport.width;
  canvas.height = viewport.height;
  await page.render({canvasContext: canvas.getContext("2d"), viewport}).promise;
  if (token !== state.renderToken) return;
  const text = evidence?.quote_text || evidence?.table_text || evidence?.evidence_text || evidence?.caption_text || "";
  let quoteMatch = {boxes: [], partial: false};
  if (text) {
    const content = await page.getTextContent();
    quoteMatch = buildQuoteHighlightMatch(content.items, viewport, text);
  }
  let boxes = quoteMatch.boxes;
  if (!boxes.length) boxes = regionBoxes(evidence, viewport);
  for (const box of boxes) {
    const div = document.createElement("div");
    div.className = `hl ${box.approx ? "approx" : ""}`;
    div.style.left = `${box.x}px`;
    div.style.top = `${box.y}px`;
    div.style.width = `${box.w}px`;
    div.style.height = `${box.h}px`;
    wrap.appendChild(div);
  }
  const pdf = pdfById(evidence.pdf_id);
  document.getElementById("pdf-page").textContent = `${pdf?.label || evidence.pdf_id}, page ${state.page} / ${state.pages}`;
  document.getElementById("zoom-label").textContent = `${Math.round(state.zoom * 100)}%`;
  if (quoteMatch.partial && quoteMatch.boxes.length) {
    const note = document.createElement("div");
    note.className = "viewer-note";
    note.textContent = "Partial quote match highlighted; verify the highlighted span against the evidence text.";
    stage.appendChild(note);
  } else if (text && !quoteMatch.boxes.length && !boxes.length) {
    const note = document.createElement("div");
    note.className = "viewer-note";
    note.textContent = `Text fallback - exact highlighting unavailable: "${text}"`;
    stage.appendChild(note);
  }
}

function clamp(value, min, max) {
  return Math.min(Math.max(value, min), max);
}

function normalizeSearchText(text) {
  return String(text || "").normalize("NFKC").toLowerCase().replace(/[^\p{L}\p{N}]+/gu, " ").replace(/\s+/g, " ").trim();
}

function tokenizeSearchText(text) {
  const normalized = normalizeSearchText(text);
  return normalized ? normalized.split(" ") : [];
}

function extractTextFragments(items, viewport) {
  const fragments = [];
  for (const item of items || []) {
    if (!item || typeof item.str !== "string" || !Array.isArray(item.transform)) continue;
    const tokenText = normalizeSearchText(item.str);
    if (!tokenText) continue;
    const transform = window.pdfjsLib?.Util?.transform
      ? window.pdfjsLib.Util.transform(viewport.transform, item.transform)
      : multiply(viewport.transform, item.transform);
    const h = Math.max(Math.hypot(transform[2], transform[3]) || Math.abs((item.height || 0) * viewport.scale), 1);
    const w = Math.max(Math.abs((item.width || 0) * viewport.scale), 1);
    const x = clamp(transform[4], 0, viewport.width);
    const y = clamp(transform[5] - h, 0, viewport.height);
    const width = clamp(w, 0, Math.max(0, viewport.width - x));
    const height = clamp(h, 0, Math.max(0, viewport.height - y));
    if (width <= 0.5 || height <= 0.5) continue;
    fragments.push({x, y, w: width, h: height, tokenText});
  }
  return fragments;
}

function findTokenSequence(pageTokens, quoteTokens, quoteStart, length) {
  const lastStart = pageTokens.length - length;
  outer: for (let pageStart = 0; pageStart <= lastStart; pageStart += 1) {
    for (let offset = 0; offset < length; offset += 1) {
      if (pageTokens[pageStart + offset] !== quoteTokens[quoteStart + offset]) continue outer;
    }
    return pageStart;
  }
  return -1;
}

function findBestTokenSpan(pageTokens, quoteTokens) {
  if (!pageTokens.length || !quoteTokens.length) return null;
  for (let windowLength = quoteTokens.length; windowLength >= 1; windowLength -= 1) {
    for (let quoteStart = 0; quoteStart + windowLength <= quoteTokens.length; quoteStart += 1) {
      const pageStart = findTokenSequence(pageTokens, quoteTokens, quoteStart, windowLength);
      if (pageStart !== -1) {
        return {start: pageStart, end: pageStart + windowLength - 1, matchLength: windowLength};
      }
    }
    if (windowLength <= 6 && quoteTokens.length > 24) break;
  }
  return null;
}

function buildQuoteHighlightMatch(items, viewport, quoteText) {
  const fragments = extractTextFragments(items, viewport);
  if (!fragments.length) return {boxes: [], partial: false};
  const quoteTokens = tokenizeSearchText(quoteText);
  if (!quoteTokens.length) return {boxes: [], partial: false};
  const stream = [];
  fragments.forEach((fragment, fragmentIndex) => {
    fragment.tokenText.split(" ").filter(Boolean).forEach((token) => {
      stream.push({token, fragmentIndex});
    });
  });
  const tokenSpan = findBestTokenSpan(stream.map((item) => item.token), quoteTokens);
  if (!tokenSpan) return {boxes: [], partial: false};
  const indexes = new Set();
  for (let i = tokenSpan.start; i <= tokenSpan.end; i += 1) indexes.add(stream[i].fragmentIndex);
  return {
    boxes: mergeFragmentBoxes(fragments.filter((_, index) => indexes.has(index)), viewport),
    partial: tokenSpan.matchLength < quoteTokens.length
  };
}

function mergeFragmentBoxes(boxes, viewport) {
  if (!boxes.length) return [];
  const ordered = [...boxes].sort((left, right) => {
    if (Math.abs(left.y - right.y) > 3) return left.y - right.y;
    return left.x - right.x;
  });
  const merged = [];
  for (const box of ordered) {
    const current = {
      x: clamp(box.x - 2, 0, viewport.width),
      y: clamp(box.y - 1, 0, viewport.height),
      w: clamp(box.w + 4, 0, viewport.width),
      h: clamp(box.h + 2, 0, viewport.height),
      approx: false
    };
    const previous = merged.at(-1);
    if (!previous) {
      merged.push(current);
      continue;
    }
    const previousMid = previous.y + previous.h / 2;
    const currentMid = current.y + current.h / 2;
    const sameLine = Math.abs(previousMid - currentMid) <= Math.max(previous.h, current.h) * 0.7;
    const closeEnough = current.x <= previous.x + previous.w + 24;
    if (sameLine && closeEnough) {
      const nextX = Math.min(previous.x, current.x);
      const nextY = Math.min(previous.y, current.y);
      const nextRight = Math.max(previous.x + previous.w, current.x + current.w);
      const nextBottom = Math.max(previous.y + previous.h, current.y + current.h);
      merged[merged.length - 1] = {
        x: nextX,
        y: nextY,
        w: clamp(nextRight - nextX, 0, viewport.width - nextX),
        h: clamp(nextBottom - nextY, 0, viewport.height - nextY),
        approx: false
      };
      continue;
    }
    merged.push(current);
  }
  return merged;
}

function multiply(a, b) {
  return [
    a[0] * b[0] + a[2] * b[1],
    a[1] * b[0] + a[3] * b[1],
    a[0] * b[2] + a[2] * b[3],
    a[1] * b[2] + a[3] * b[3],
    a[0] * b[4] + a[2] * b[5] + a[4],
    a[1] * b[4] + a[3] * b[5] + a[5]
  ];
}

function regionBoxes(evidence, viewport) {
  const regions = evidence?.exact_highlight_regions || evidence?.approximate_highlight_regions || [];
  return regions.filter((region) => Number(region.page || evidence.page_number) === state.page).map((region) => {
    const normalized = Math.max(Math.abs(region.x0), Math.abs(region.x1), Math.abs(region.y0), Math.abs(region.y1)) <= 1.05;
    if (normalized) {
      const x0 = Math.min(region.x0, region.x1);
      const x1 = Math.max(region.x0, region.x1);
      const y0 = Math.min(region.y0, region.y1);
      const y1 = Math.max(region.y0, region.y1);
      return {x: x0 * viewport.width, y: (1 - y1) * viewport.height, w: (x1 - x0) * viewport.width, h: (y1 - y0) * viewport.height, approx: true};
    }
    return {x: region.x0 * state.zoom, y: viewport.height - region.y1 * state.zoom, w: (region.x1 - region.x0) * state.zoom, h: (region.y1 - region.y0) * state.zoom, approx: true};
  });
}

document.getElementById("mode-queue").addEventListener("click", () => {
  state.mode = "queue";
  document.getElementById("mode-queue").classList.add("active");
  document.getElementById("mode-table").classList.remove("active");
  renderList();
});
document.getElementById("mode-table").addEventListener("click", () => {
  state.mode = "table";
  document.getElementById("mode-table").classList.add("active");
  document.getElementById("mode-queue").classList.remove("active");
  renderList();
});
document.getElementById("filter").addEventListener("change", (event) => { state.filter = event.target.value; renderList(); });
document.getElementById("accept").addEventListener("click", () => makeDecision("accepted"));
document.getElementById("reject").addEventListener("click", () => makeDecision("rejected"));
document.getElementById("no-data").addEventListener("click", () => makeDecision("confirmed_no_data"));
document.getElementById("edit").addEventListener("click", () => {
  const proposal = currentProposal();
  document.getElementById("edit-value").value = displayValue(proposal);
  document.getElementById("edit-row").classList.add("visible");
});
document.getElementById("save-edit").addEventListener("click", () => {
  const value = document.getElementById("edit-value").value.trim();
  if (value) makeDecision("accepted_with_edit", {edited_value: value});
  document.getElementById("edit-row").classList.remove("visible");
});
document.getElementById("cancel-edit").addEventListener("click", () => document.getElementById("edit-row").classList.remove("visible"));
document.getElementById("prev-proposal").addEventListener("click", () => moveSelection(-1));
document.getElementById("next-proposal").addEventListener("click", () => moveSelection(1));
document.getElementById("download-decisions").addEventListener("click", downloadDecisions);
document.getElementById("write-decisions").addEventListener("click", writeDecisions);
document.getElementById("export-csv").addEventListener("click", exportCsv);
document.getElementById("pdf-prev").addEventListener("click", async () => {
  if (!state.pdfDoc) return;
  state.page = Math.max(1, state.page - 1);
  await renderCurrentPage(currentProposal()?.evidence?.find((item) => item.evidence_id === state.selectedEvidenceId));
});
document.getElementById("pdf-next").addEventListener("click", async () => {
  if (!state.pdfDoc) return;
  state.page = Math.min(state.pages, state.page + 1);
  await renderCurrentPage(currentProposal()?.evidence?.find((item) => item.evidence_id === state.selectedEvidenceId));
});
document.getElementById("zoom-out").addEventListener("click", async () => {
  state.zoom = Math.max(.65, +(state.zoom - .15).toFixed(2));
  await renderCurrentPage(currentProposal()?.evidence?.find((item) => item.evidence_id === state.selectedEvidenceId));
});
document.getElementById("zoom-in").addEventListener("click", async () => {
  state.zoom = Math.min(2.5, +(state.zoom + .15).toFixed(2));
  await renderCurrentPage(currentProposal()?.evidence?.find((item) => item.evidence_id === state.selectedEvidenceId));
});

await loadServerDecisions();
render();
</script>
