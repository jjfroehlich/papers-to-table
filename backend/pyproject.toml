[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "paper-table-agent-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.0",
    "openpyxl>=3.1.0",
    "pandas>=2.0.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "docling>=2.0",
    "pypdfium2>=4.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27.0",
    "respx>=0.21.0",
]

[tool.setuptools.packages.find]
where = [".."]
include = ["backend*"]
