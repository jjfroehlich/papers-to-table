[project]
name = "paper-table-agent-backend"
version = "0.2.0"
description = "Batch 2 backend: parsing and row-matching baseline for Paper Table Agent"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "pydantic>=2.9.0",
  "uvicorn>=0.30.0",
  "openpyxl>=3.1.5",
  "docling>=2.0.0",
  "pypdfium2>=4.0.0",
  "ocrmypdf>=15.0.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "httpx>=0.27.0"
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["../tests/backend"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
